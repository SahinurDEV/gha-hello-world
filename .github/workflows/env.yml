name: Env and Outputs

on:
  workflow_dispatch:

env:
  APP_NAME: hello-world

jobs:
  show:
    runs-on: ubuntu-latest
    env:
      STAGE: test
    steps:
      - name: Read env at three levels
        env:
          GREETING: Hi
        run: echo "$GREETING from $APP_NAME in $STAGE"
      - name: Set a value for later steps
        id: pick
        run: |
          echo "BUILD_DAY=$(date +%A)" >> "$GITHUB_ENV"
          echo "color=green" >> "$GITHUB_OUTPUT"
      - name: Use them
        run: echo "Built on $BUILD_DAY, color ${{ steps.pick.outputs.color }}"
      - name: Write a job summary
        run: |
          echo "## Build report" >> "$GITHUB_STEP_SUMMARY"
          echo "| App | Stage | Day |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| $APP_NAME | $STAGE | $BUILD_DAY |" >> "$GITHUB_STEP_SUMMARY"
