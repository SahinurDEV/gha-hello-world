name: Nightly Check

on:
  schedule:
    # minute hour day-of-month month day-of-week (UTC)
    - cron: "30 2 * * *"      # every day at 02:30 UTC
  workflow_dispatch:           # also allow a manual run for testing

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          date -u
